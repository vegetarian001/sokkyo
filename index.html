<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1,
               user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mil Camera">

<title>Mil Camera</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: black;
}

#zoomButtons {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 7px;
    z-index: 10;
}

.zoom {
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 10px;
    padding: 8px 13px;
    background: rgba(0,0,0,.6);
    color: white;
    font-size: 14px;
}

.zoom.active {
    background: rgba(0,170,70,.8);
    border-color: white;
}

/* レティクル */
#reticle {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

/* 中央線 */
.centerHorizontal {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: rgba(0,255,80,.8);
}

.centerVertical {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: rgba(0,255,80,.8);
}

/* 中央 */
.centerDot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 9px;
    transform: translate(-50%, -50%);
    border: 1px solid #00ff55;
    border-radius: 50%;
}

/* 横mil */
#horizontalMil {
    position: absolute;
    left: 50%;
    bottom: 17%;
    width: 90%;
    height: 45px;
    transform: translateX(-50%);
}

/* 縦mil */
#verticalMil {
    position: absolute;
    top: 10%;
    left: 50%;
    width: 45px;
    height: 80%;
    transform: translateX(-50%);
}

/* 目盛り */
.tickH {
    position: absolute;
    top: 0;
    width: 1px;
    background: #00ff55;
}

.tickV {
    position: absolute;
    left: 0;
    height: 1px;
    background: #00ff55;
}

.number {
    position: absolute;
    color: #baffc8;
    font-size: 10px;
    text-shadow: 0 1px 3px black;
}

/* 下部UI */
#bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 18px);
    display: flex;
    justify-content: center;
    z-index: 20;
}

#shutter {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 5px solid rgba(255,255,255,.8);
    background: white;
    font-size: 0;
}

/* 状態表示 */
#status {
    position: fixed;
    left: 10px;
    bottom: calc(env(safe-area-inset-bottom) + 100px);
    padding: 6px 9px;
    border-radius: 7px;
    background: rgba(0,0,0,.6);
    color: white;
    font-size: 12px;
    z-index: 20;
}

/* 写真確認画面 */
#preview {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#previewImage {
    max-width: 100%;
    max-height: 80%;
    object-fit: contain;
}

#closePreview {
    margin-top: 15px;
    padding: 10px 22px;
    border: 1px solid white;
    border-radius: 10px;
    background: rgba(255,255,255,.15);
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<!-- 倍率 -->
<div id="zoomButtons">
    <button class="zoom active" data-zoom="1">1×</button>
    <button class="zoom" data-zoom="3">3×</button>
    <button class="zoom" data-zoom="5">5×</button>
    <button class="zoom" data-zoom="7">7×</button>
    <button class="zoom" data-zoom="9">9×</button>
</div>

<!-- レティクル -->
<div id="reticle">

    <div class="centerHorizontal"></div>
    <div class="centerVertical"></div>

    <div class="centerDot"></div>

    <!-- 横方向mil -->
    <div id="horizontalMil"></div>

    <!-- 縦方向mil -->
    <div id="verticalMil"></div>

</div>

<div id="status">
    カメラ起動中…
</div>

<!-- シャッター -->
<div id="bottom">
    <button id="shutter"></button>
</div>

<!-- 写真確認 -->
<div id="preview">
    <img id="previewImage">
    <button id="closePreview">戻る</button>
</div>

<script>

const video = document.getElementById("camera");
const status = document.getElementById("status");

let stream = null;
let cameraTrack = null;
let currentZoom = 1;

/*
 * mil目盛り
 *
 * 中央を0として
 * 左右・上下に5 mil刻み。
 *
 * 10 milごとに数字を表示。
 */

function createMilScale() {

    const horizontal =
        document.getElementById("horizontalMil");

    const vertical =
        document.getElementById("verticalMil");

    horizontal.innerHTML = "";
    vertical.innerHTML = "";

    const range = 50;

    /*
     * 画面上での目盛り間隔。
     * 実際の光学照準器と同じ視角になるよう
     * 校正する場合はここを調整する。
     */
    const pixelsPerMil = 4;

    for (let mil = -range; mil <= range; mil += 5) {

        /*
         * 横
         */

        const x =
            mil * pixelsPerMil;

        const tickH =
            document.createElement("div");

        tickH.className = "tickH";

        tickH.style.left =
            `calc(50% + ${x}px)`;

        tickH.style.height =
            mil % 10 === 0
                ? "22px"
                : "13px";

        tickH.style.transform =
            "translateX(-50%)";

        horizontal.appendChild(tickH);


        /*
         * 横の数字
         */

        if (mil !== 0 && mil % 10 === 0) {

            const number =
                document.createElement("div");

            number.className = "number";

            number.textContent =
                Math.abs(mil);

            number.style.left =
                `calc(50% + ${x}px)`;

            number.style.top =
                "25px";

            number.style.transform =
                "translateX(-50%)";

            horizontal.appendChild(number);
        }


        /*
         * 縦
         */

        const y =
            mil * pixelsPerMil;

        const tickV =
            document.createElement("div");

        tickV.className = "tickV";

        tickV.style.top =
            `calc(50% + ${-y}px)`;

        tickV.style.width =
            mil % 10 === 0
                ? "22px"
                : "13px";

        tickV.style.transform =
            "translateY(-50%)";

        vertical.appendChild(tickV);


        /*
         * 縦の数字
         */

        if (mil !== 0 && mil % 10 === 0) {

            const number =
                document.createElement("div");

            number.className = "number";

            number.textContent =
                Math.abs(mil);

            number.style.top =
                `calc(50% + ${-y}px)`;

            number.style.left =
                "25px";

            number.style.transform =
                "translateY(-50%)";

            vertical.appendChild(number);
        }
    }
}

createMilScale();


/*
 * カメラ起動
 */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false
            });

        video.srcObject = stream;

        cameraTrack =
            stream.getVideoTracks()[0];

        await video.play();

        status.textContent =
            "カメラOK";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "カメラへのアクセスを許可してください";
    }
}


/*
 * 倍率変更
 *
 * iPhone / SafariがカメラズームAPIに
 * 対応している場合は実際のカメラズーム。
 *
 * 対応していなければ画面側の拡大で代用。
 */

async function changeZoom(value) {

    currentZoom = value;

    document
        .querySelectorAll(".zoom")
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(button.dataset.zoom) === value
            );

        });


    let hardwareZoom =
        false;

    try {

        const capabilities =
            cameraTrack.getCapabilities();

        if (
            capabilities.zoom &&
            capabilities.zoom.min !== undefined
        ) {

            const actualZoom =
                Math.max(
                    capabilities.zoom.min,
                    Math.min(
                        capabilities.zoom.max,
                        value
                    )
                );

            await cameraTrack.applyConstraints({

                advanced: [
                    {
                        zoom: actualZoom
                    }
                ]

            });

            hardwareZoom = true;
        }

    }

    catch (error) {

        hardwareZoom = false;

    }


    /*
     * ハードウェアズームが使えない場合
     * CSS拡大を使用
     */

    if (!hardwareZoom) {

        video.style.transform =
            `scale(${value})`;

    }

    else {

        video.style.transform =
            "none";

    }


    status.textContent =
        `倍率 ${value}×`;
}


/*
 * 倍率ボタン
 */

document
    .querySelectorAll(".zoom")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                changeZoom(
                    Number(button.dataset.zoom)
                );

            }
        );

    });


/*
 * 写真撮影
 *
 * カメラ映像＋目盛りを1枚の画像にする。
 */

document
    .getElementById("shutter")
    .addEventListener("click", () => {

        if (!video.videoWidth) return;

        const canvas =
            document.createElement("canvas");

        const width =
            video.videoWidth;

        const height =
            video.videoHeight;

        canvas.width = width;
        canvas.height = height;

        const ctx =
            canvas.getContext("2d");


        /*
         * カメラ画像
         */

        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        /*
         * レティクル
         */

        const centerX =
            width / 2;

        const centerY =
            height / 2;

        ctx.strokeStyle =
            "rgba(0,255,80,.85)";

        ctx.fillStyle =
            "rgba(190,255,205,.95)";

        ctx.lineWidth = 1;


        /*
         * 中央線
         */

        ctx.beginPath();

        ctx.moveTo(0, centerY);
        ctx.lineTo(width, centerY);

        ctx.moveTo(centerX, 0);
        ctx.lineTo(centerX, height);

        ctx.stroke();


        /*
         * mil目盛り
         */

        const pixelsPerMil =
            width / 900;

        for (
            let mil = -50;
            mil <= 50;
            mil += 5
        ) {

            const x =
                centerX +
                mil * pixelsPerMil;

            if (x >= 0 && x <= width) {

                const tickHeight =
                    mil % 10 === 0
                        ? 22
                        : 13;

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    centerY - tickHeight
                );

                ctx.lineTo(
                    x,
                    centerY + tickHeight
                );

                ctx.stroke();


                if (
                    mil !== 0 &&
                    mil % 10 === 0
                ) {

                    ctx.font =
                        `${Math.max(
                            14,
                            width / 90
                        )}px sans-serif`;

                    ctx.fillText(
                        Math.abs(mil),
                        x + 4,
                        centerY + 38
                    );
                }
            }


            const y =
                centerY -
                mil * pixelsPerMil;

            if (y >= 0 && y <= height) {

                const tickWidth =
                    mil % 10 === 0
                        ? 22
                        : 13;

                ctx.beginPath();

                ctx.moveTo(
                    centerX - tickWidth,
                    y
                );

                ctx.lineTo(
                    centerX + tickWidth,
                    y
                );

                ctx.stroke();


                if (
                    mil !== 0 &&
                    mil % 10 === 0
                ) {

                    ctx.font =
                        `${Math.max(
                            14,
                            width / 90
                        )}px sans-serif`;

                    ctx.fillText(
                        Math.abs(mil),
                        centerX + 30,
                        y + 5
                    );
                }
            }
        }


        /*
         * 中央円
         */

        ctx.beginPath();

        ctx.arc(
            centerX,
            centerY,
            7,
            0,
            Math.PI * 2
        );

        ctx.stroke();


        /*
         * 写真表示
         */

        const image =
            document.getElementById(
                "previewImage"
            );

        image.src =
            canvas.toDataURL(
                "image/jpeg",
                0.92
            );

        document
            .getElementById("preview")
            .style.display =
                "flex";

    });


/*
 * 写真確認から戻る
 */

document
    .getElementById("closePreview")
    .addEventListener("click", () => {

        document
            .getElementById("preview")
            .style.display =
                "none";

    });


/*
 * 起動
 */

startCamera();

</script>

</body>
</html>
